name: Release

# Pushing a v* tag (or a manual run) signs → notarizes → builds the .dmg and
# attaches it to a GitHub Release.
#
# Secrets to register beforehand (after joining the Apple Developer Program):
#   MACOS_CERTIFICATE      … Developer ID Application cert (.p12) base64-encoded
#                            base64 -i cert.p12 | pbcopy
#   MACOS_CERTIFICATE_PWD  … password for that .p12
#   KEYCHAIN_PASSWORD      … any password for the temporary keychain
#   APPLE_TEAM_ID          … Team ID (10 chars)
#   NOTARY_APPLE_ID        … Apple ID for notarization (email)
#   NOTARY_PASSWORD        … app-specific password (created at appleid.apple.com)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Default to read-only; only the release job gets a write token.
permissions:
  contents: read

jobs:
  # All npm/vite code runs here, in a job with no signing key, no secrets and a
  # read-only token. The signing job only receives the built dist/ as an artifact.
  renderer:
    # Only release from a v* tag. A manual run must also target a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tag shown in the comment) so a moved tag
      # cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Do not leave the GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      # Refuse to sign a tag that points at a commit outside main.
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build renderer
        working-directory: renderer
        run: npm ci --ignore-scripts && npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-dist
          path: renderer/dist
          if-no-files-found: error

  release:
    needs: renderer
    permissions:
      contents: write
    # The .xcodeproj XcodeGen emits is a newer format (Xcode 16), so pick a runner
    # with a recent Xcode plus the latest-stable Xcode.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: renderer-dist
          path: renderer/dist

      # XcodeGen is installed and run before the certificate exists on the runner;
      # build.sh then reuses the generated project (SKIP_XCODEGEN=1).
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

      - name: Build (Developer ID signed)
        env:
          SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          SKIP_RENDERER_BUILD: "1"
          SKIP_XCODEGEN: "1"
        run: ./scripts/build.sh

      # Remove the signing key before any further third-party action runs.
      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Notarize & staple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./scripts/notarize.sh

      - name: Attach .dmg to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: QuickLook3D.dmg
